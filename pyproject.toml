[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dememory"
dynamic = ["version"]
description = "Small, local-first memory for people and AI tools."
readme = "README-PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gonzalo Torreras" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/GonzaloTorreras/ai-dememory"
Repository = "https://github.com/GonzaloTorreras/ai-dememory"
Issues = "https://github.com/GonzaloTorreras/ai-dememory/issues"
Documentation = "https://github.com/GonzaloTorreras/ai-dememory/tree/main/docs"

[project.scripts]
ai-dememory = "ai_dememory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "ai_dememory.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_dememory*"]
