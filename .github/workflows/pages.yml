name: Deploy documentation to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Exact current main commit approved for documentation deployment."
        required: true
        type: string
      confirm:
        description: "Type deploy-pages@<approved_sha>."
        required: true
        type: string

permissions: {}

concurrency:
  group: ai-dememory-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate exact main deployment authorization
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          test "$DEPLOY_CONFIRM" = "deploy-pages@$APPROVED_SHA"
          live_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$live_main_sha" = "$APPROVED_SHA"

      - name: Check out approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate workflow security boundaries
        run: python scripts/ci_guard.py

      - name: Validate static documentation
        run: python scripts/docs_site_guard.py

      - name: Run focused Pages tests
        run: python -m unittest tests.test_docs_site tests.test_pages_delivery

      - name: Guard exact Pages artifact
        run: python scripts/pages_artifact_guard.py

      - name: Upload exact GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: site
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
