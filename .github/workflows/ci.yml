name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Verify isolated package namespace and CLI
        working-directory: ${{ runner.temp }}
        run: python -c "import ai_dememory; assert 'site-packages' in ai_dememory.__file__; print(ai_dememory.__file__)"
      - name: Verify CLI and focused tests
        run: |
          ai-dememory --version
          python -m compileall -q src/ai_dememory
          python -m unittest discover -s tests_v3 -t .
      - name: Run a real installed CLI flow
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          export AI_DEMEMORY_CONFIG_DIR="$RUNNER_TEMP/config"
          ai-dememory setup "$RUNNER_TEMP/vault" --yes
          ai-dememory remember "CI remembers deterministic local state" --title "CI memory"
          ai-dememory recall deterministic
          ai-dememory status --json
