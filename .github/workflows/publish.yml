name: V3 release preflight (no upload)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type preflight to run a read-only package check."
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'preflight' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test product
        run: |
          python -m compileall -q src/ai_dememory
          python -m unittest discover -s tests_v3 -t .
      - name: Build and inspect package
        run: |
          python -m pip install build==1.2.2.post1 twine==6.1.0
          python -m build
          python -m twine check dist/*
          python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert any(x.startswith('ai_dememory/') for x in n); assert not any(x.startswith(('ai_dememory_tool/','scripts/','mcp/')) for x in n); print(p)"
          ! tar -tf dist/*.tar.gz | grep -Eq '/(tests|tests_v3|scripts|mcp|ai_dememory_tool)/'
