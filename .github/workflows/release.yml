name: Publish explicitly approved V3 package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag."
        required: true
        type: string
      approved_sha:
        description: "Exact commit resolved by the tag."
        required: true
        type: string
      confirm:
        description: "Type publish-<tag>@<approved_sha>."
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-dememory-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - name: Validate explicit publication approval
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$RELEASE_CONFIRM" = "publish-$RELEASE_TAG@$APPROVED_SHA"
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate exact identity and product
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$APPROVED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$APPROVED_SHA"
          version="$(PYTHONPATH=src python -c 'import ai_dememory; print(ai_dememory.__version__)')"
          test "$RELEASE_TAG" = "v$version"
          test "$(grep -Fxc "## [$version] - $(date -u +%F)" CHANGELOG.md)" -eq 1
          successful_runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$APPROVED_SHA" -f branch=main -f event=push -f status=completed -f per_page=20 --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -ge 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ [A-Za-z] ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          python -m compileall -q src/ai_dememory
          python -m unittest discover -s tests_v3 -t .

  build:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build once and inspect exact artifacts
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          python -m pip install build==1.2.2.post1 twine==6.1.0
          python -m build
          python -m twine check dist/*
          python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert any(x.startswith('ai_dememory/') for x in n); assert not any(x.startswith(('ai_dememory_tool/','scripts/','mcp/')) for x in n)"
          ! tar -tf dist/*.tar.gz | grep -Eq '/(tests|tests_v3|scripts|mcp|ai_dememory_tool)/'
          python -m venv /tmp/ai-dememory-smoke
          /tmp/ai-dememory-smoke/bin/pip install --no-deps dist/*.whl
          export AI_DEMEMORY_CONFIG_DIR=/tmp/ai-dememory-config
          /tmp/ai-dememory-smoke/bin/ai-dememory --version
          /tmp/ai-dememory-smoke/bin/ai-dememory setup /tmp/ai-dememory-vault --yes
          /tmp/ai-dememory-smoke/bin/ai-dememory remember "release artifact smoke" --title "Release smoke"
          /tmp/ai-dememory-smoke/bin/ai-dememory recall artifact
          /tmp/ai-dememory-smoke/bin/ai-dememory status --json
          sha256sum dist/* | sort -k2 > SHA256SUMS
      - uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-release-${{ inputs.tag }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    needs: [validate, build]
    if: needs.validate.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ai-dememory
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-${{ inputs.tag }}
          path: release-bundle
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release-bundle/dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [validate, build]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ai-dememory
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-${{ inputs.tag }}
          path: release-bundle
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release-bundle/dist/

  verify-and-release:
    needs: [validate, build, publish-testpypi, publish-pypi]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify published index package
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then INDEX=https://test.pypi.org/simple/; else INDEX=https://pypi.org/simple/; fi
          for attempt in {1..12}; do python -m pip install --no-cache-dir --index-url "$INDEX" "ai-dememory==$RELEASE_VERSION" && ai-dememory --version && exit 0; sleep 10; done
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release-${{ inputs.tag }}
          path: release-bundle
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          extra=(); if [[ "$PRERELEASE" == "true" ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-bundle/dist/* release-bundle/SHA256SUMS --verify-tag --generate-notes --title "ai-dememory $RELEASE_TAG" "${extra[@]}"
